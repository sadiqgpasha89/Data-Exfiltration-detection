name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt && pip install -e .
      - run: ruff check src tests
      - run: pytest tests -q --cov=src --cov-report=term-missing --cov-fail-under=85
      - run: pip-audit -r requirements.txt

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t sentinel-exfil .
      - name: refuses to start unconfigured
        run: |
          docker run --rm -e APP_ENV=production sentinel-exfil python -c "
          from src.core.config import Settings
          problems = Settings().production_problems()
          assert problems, 'production must refuse an empty configuration'
          print('\n'.join(problems))"
